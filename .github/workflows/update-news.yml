name: Appack News aktualisieren

on:
  workflow_dispatch:
  schedule:
    # Einmal pro Stunde, bewusst nicht genau zur vollen Stunde
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Neueste Appack-News suchen
        run: python scripts/update_news.py

      - name: Änderung speichern
        run: |
          if git diff --quiet latest-news.json; then
            echo "Keine neue News gefunden."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-news.json
          git commit -m "Neueste Appack-News aktualisieren"
          git push
