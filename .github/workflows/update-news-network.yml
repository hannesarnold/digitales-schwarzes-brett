name: Appack News Netzwerk-Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  network-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Appack-Netzwerk untersuchen
        run: python scripts/news_network_test.py

      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news-network-debug.json

          if git diff --cached --quiet; then
            echo "Keine Änderung."
            exit 0
          fi

          git commit -m "Appack News Netzwerk-Test"
          git push
