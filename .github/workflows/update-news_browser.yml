name: Appack News Browser-Test

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

jobs:
  browser-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Appack-News im Browser laden
        run: python scripts/update_news_browser.py

      - name: Ergebnis speichern
        run: |
          if git diff --quiet latest-news.json news-debug.json; then
            echo "Keine Änderung."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-news.json news-debug.json
          git commit -m "Appack News Browser-Test aktualisiert"
          git push
