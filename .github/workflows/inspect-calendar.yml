name: Appack Kalender untersuchen

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-calendar.yml"
      - "scripts/inspect_calendar.py"

jobs:
  inspect-calendar:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Kalender untersuchen
        run: python scripts/inspect_calendar.py
