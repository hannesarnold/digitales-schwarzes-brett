name: Kommende Appack-Termine aktualisieren

on:
  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/update-next-events.yml"
      - "scripts/update_next_events.py"

  schedule:
    # Einmal pro Stunde, versetzt zum News-Workflow
    - cron: "32 * * * *"

permissions:
  contents: write

jobs:
  update-next-events:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Kommende Termine ermitteln
        run: python scripts/update_next_events.py

      - name: Änderung speichern
        run: |
          git add next-events.json

          if git diff --cached --quiet; then
            echo "Keine Änderung an next-events.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Kommende Appack-Termine aktualisieren"
          git push
