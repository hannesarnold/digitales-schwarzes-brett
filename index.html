<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>Wildes Hagen</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

<style>

/* ================================
   GRUNDEINSTELLUNGEN
   ================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #ffffff;
}


/* ================================
   GESAMTE APP
   ================================ */

#app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* ================================
   INHALTSBEREICH
   ================================ */

#content {
    flex: 1;

    position: relative;

    overflow: hidden;

    background: white;
}


/* ================================
   APPACK / WEBSEITEN
   ================================ */

#anzeige {
    transform: scale(2.70);
    transform-origin: top left;
    width: 37.037% !important;
    height: 37.037% !important;
}


/* Größere Schaltflächen unter Mehr */
.mehrButton {
    min-height: 150px !important;
    font-size: 34px !important;
    border-radius: 24px !important;
    padding: 26px 30px !important;
}

.mehrIcon {
    font-size: 46px !important;
}


/* ================================
   KIOSK-NAVIGATION v0.9.4
   ================================ */

nav {
    min-height: 320px !important;
    padding: 28px 30px !important;
}

.navButton {
    min-height: 250px !important;
    font-size: 60px !important;
    gap: 18px !important;
    border-radius: 34px !important;
}

.navButton svg {
    width: 96px !important;
    height: 96px !important;
}

.navButton span {
    font-size: 60px !important;
    font-weight: 800 !important;
}


/* ================================
   MEHR-SEITE v0.9.4
   ================================ */

#mehrSeite {
    padding: 70px 80px 360px 80px !important;
    box-sizing: border-box !important;
    overflow-y: auto !important;
}

#mehrSeite h2,
#mehrSeite h1 {
    font-size: 74px !important;
    margin-bottom: 50px !important;
}

.mehrGrid {
    gap: 34px !important;
}

.mehrButton {
    min-height: 280px !important;
    font-size: 58px !important;
    border-radius: 34px !important;
    padding: 38px 42px !important;
}

.mehrButton span {
    font-size: 58px !important;
}

.mehrIcon {
    font-size: 82px !important;
    margin-bottom: 14px !important;
}


/* ================================
   UNTERSEITEN v0.9.4
   ================================ */

#dorfladenSeite {
    padding: 70px 80px 360px 80px !important;
    box-sizing: border-box !important;
    overflow-y: auto !important;
}

#dorfladenSeite h1,
#dorfladenSeite h2 {
    font-size: 72px !important;
    line-height: 1.15 !important;
}

#dorfladenSeite h3 {
    font-size: 52px !important;
    line-height: 1.2 !important;
}

#dorfladenSeite p,
#dorfladenSeite div,
#dorfladenSeite span {
    font-size: 40px !important;
    line-height: 1.45 !important;
}

#dorfladenSeite .mehrButton {
    min-height: 260px !important;
    font-size: 54px !important;
}

#dorfladenIframe {
    min-height: 2200px !important;
}

/* Karte größer bedienbar */
#kartenSeite .leaflet-control-zoom a {
    width: 84px !important;
    height: 84px !important;
    line-height: 84px !important;
    font-size: 52px !important;
}

.leaflet-popup-content {
    font-size: 34px !important;
    line-height: 1.35 !important;
}

.leaflet-popup-content strong {
    font-size: 40px !important;
}

</style>
</head>


<body>

<div id="app">


<!-- ================================
     INHALT
     ================================ -->

<main id="content">


    
    <!-- ============================
         EIGENE STARTSEITE v0.9.4
         ============================ -->

    <div id="startSeite">

        <div class="startBildEbene">
            <div class="startBildHaelfte oben">
                <div id="startObenAktuell" class="startBild aktuell"
                     style="background-image:url('images/start_1.png');"></div>
                <div id="startObenNeu" class="startBild naechstesRechts"
                     style="background-image:url('images/start_2.png');"></div>
            </div>

            <div class="startBildHaelfte unten">
                <div id="startUntenAktuell" class="startBild aktuell"
                     style="background-image:url('images/start_3.png');"></div>
                <div id="startUntenNeu" class="startBild naechstesLinks"
                     style="background-image:url('images/start_4.png');"></div>
            </div>
        </div>

        <div class="startAbdunklung"></div>

        <div class="startVordergrund">
            <div class="startHeadline">
                <img
                    src="images/headline.png"
                    alt="Wildes Hagen – Hagen und Wildewiese"
                >
            </div>

            <div class="startInfoBereich">
                <div class="startKarte">
                    <div id="startDatum" class="startDatum"></div>
                    <div id="startUhrzeit" class="startUhrzeit"></div>
                </div>

                <div class="startKarte">
                    <div class="startInfoTitel">Wetter</div>
                    <div id="startWetter" class="startInfoWert">– °C</div>
                    <div class="startInfoHinweis">
                        Wetterdienst wird als nächster Schritt eingebunden.
                    </div>
                </div>

                <div class="startKarte" id="startNewsKarte">
                    <div class="startInfoTitel">Neueste Meldung</div>

                    <img
                        id="startNewsBild"
                        alt=""
                        style="
                            display:none;
                            width:100%;
                            max-height:520px;
                            object-fit:cover;
                            border-radius:22px;
                            margin:10px 0 24px 0;
                        "
                    >

                    <div id="startNews" class="startInfoWert">
                        Neueste Meldung wird geladen …
                    </div>

                    <div
                        id="startNewsDatum"
                        class="startInfoHinweis">
                    </div>
                </div>
            </div>
        </div>

        <div class="startQr">
            <div class="startQrTitel">
                Wildes Hagen App herunterladen
            </div>
            <img
                src="images/qr_store.png"
                alt="QR-Code für die Wildes Hagen App – App Store und Google Play"
            >
        </div>

    </div>


    <iframe
        id="anzeige"
        src="about:blank">
    </iframe>



    <!-- ============================
         UNSERE EIGENE MEHR-SEITE
         ============================ -->

    <div id="mehrSeite">


        <h1 class="mehrTitel">

            Mehr

        </h1>


        <div class="mehrGrid">

<!-- DORFLADEN -->

            <button
                class="mehrButton"
                onclick="zeigeDorfladen()">

                <span class="mehrIcon">
                    🛒
                </span>

                <span>
                    Dorfladen
                </span>

            </button>



            <!-- VEREINE -->

            <button
                class="mehrButton"
                onclick="zeigeVereine()">

                <span class="mehrIcon">
                    👥
                </span>

                <span>
                    Vereine
                </span>

            </button>



            <!-- DORFCHRONIK -->

            <button
                class="mehrButton"
                onclick="zeigeChronik()">

                <span class="mehrIcon">
                    📖
                </span>

                <span>
                    Dorfchronik
                </span>

                <span class="mehrHinweis">
                    Wildes Hagen
                </span>

            </button>



            <!-- KARTE -->

            <button
                class="mehrButton"
                onclick="zeigeKarte()">

                <span class="mehrIcon">
                    🗺️
                </span>

                <span>
                    Karte
                </span>

            </button>



            <!-- STAMMTISCHE -->

            <button
                class="mehrButton"
                onclick="zeigeStammtische()">

                <span class="mehrIcon">
                    🍻
                </span>

                <span>
                    Stammtische
                </span>

            </button>

</div>

    </div>

    <div id="kartenSeite"><div id="dorfkarte"></div></div>

    <!-- ============================
         DORFLADEN
         ============================ -->

    <div id="dorfladenSeite" style="
        display:none;
        width:100%;
        height:100%;
        overflow:auto;
        background:white;
        padding:24px;
        box-sizing:border-box;
    ">
        <div id="dorfladenMenue">
            <h2 style="margin-top:0;">Dorfladen Hagen</h2>

            <p style="font-size:18px; line-height:1.45;">
                Bitte gewünschten Bereich auswählen.
            </p>

            <div style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:16px;
                margin-top:22px;
            ">
<button class="mehrButton" onclick="zeigeDorfladenInhalt('sortiment')">
                    <span class="mehrIcon">🧺</span>
                    <span>Sortiment</span>
                </button>

                <button class="mehrButton" onclick="zeigeDorfladenInhalt('steckbrief')">
                    <span class="mehrIcon">ℹ️</span>
                    <span>Steckbrief</span>
                </button>

                <button class="mehrButton" onclick="zeigeDorfladenInhalt('geschenkkoerbe')">
                    <span class="mehrIcon">🎁</span>
                    <span>Geschenkkörbe</span>
                </button>

                <button class="mehrButton" onclick="zeigeMehr()">
                    <span class="mehrIcon">←</span>
                    <span>Zurück zu Mehr</span>
                </button>
            </div>
        </div>

        <div id="dorfladenInhalt" style="display:none;">
<div id="dorfladenText" style="
                font-size:18px;
                line-height:1.55;
                padding-bottom:30px;
            "></div>

            <iframe
                id="dorfladenIframe"
                title="Dorfladen Sortiment"
                style="
                    display:none;
                    width:100%;
                    height:calc(100vh - 210px);
                    min-height:650px;
                    border:0;
                    background:white;
                ">
            </iframe>
        </div>
    </div>

</main>



<!-- ================================
     NAVIGATION
     ================================ -->

<div id="navigationBereich">


<nav id="navigation">


    <!-- START -->

    <button
        id="nav-start"
        class="navButton aktiv"
        onclick="zeigeStart()">

        <span class="navIcon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3L4 10h2v9h5v-5h2v5h5v-9h2L12 3z"/>
                </svg>
        </span>

        <span>
            Start
        </span>

    </button>



    <!-- NEWS -->

    <button
        id="nav-news"
        class="navButton"
        onclick="zeigeNews()">

        <span class="navIcon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4h16v12H8l-4 4V4zm4 4h8v2H8V8zm0 4h6v2H8v-2z"/>
                </svg>
        </span>

        <span>
            News
        </span>

    </button>



    <!-- TERMINE -->

    <button
        id="nav-termine"
        class="navButton"
        onclick="zeigeTermine()">

        <span class="navIcon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7 2h2v2h6V2h2v2h3v17H4V4h3V2zm11 7H6v10h12V9z"/>
                </svg>
        </span>

        <span>
            Termine
        </span>

    </button>



    <!-- MEHR -->

    <button
        id="nav-mehr"
        class="navButton"
        onclick="zeigeMehr()">

        <span class="navIcon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="2"/>
                    <circle cx="12" cy="12" r="2"/>
                    <circle cx="19" cy="12" r="2"/>
                </svg>
        </span>

        <span>
            Mehr
        </span>

    </button>


</nav>

</div>

</div>


<script>


/* ================================
   ADRESSEN
   ================================ */

const urls = {


start:
    "about:blank",


    news:
    "https://shorturl.appack.de/sundern_Application_1765195867222",


    termine:
    "https://shorturl.appack.de/sundern_Application_1663675240711?calendarIds=",
vereine:
    "https://appack.de/rest-api/drender/6374f7dce4b08baba4be8855",


    chronik:
    "https://freiheit-hagen.de/unsere-doerfer/dorfchronik/",


    stammtische:
    "https://cdn.appack.de/sundern/html/Stammtischhistorie.html"
};



/* ================================
   STARTSEITE v0.9.4
   ================================ */

const startBilder = [
    "images/start_1.png",
    "images/start_3.png",
    "images/start_2.png",
    "images/start_4.png"
];

let startBildIndex = 0;
let startBildTimer = null;

function aktualisiereStartZeit() {

    const jetzt = new Date();

    document
        .getElementById("startDatum")
        .textContent =
        jetzt.toLocaleDateString(
            "de-DE",
            {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );

    document
        .getElementById("startUhrzeit")
        .textContent =
        jetzt.toLocaleTimeString(
            "de-DE",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ) + " Uhr";
}

function wechsleStartBilder() {

    const obenAlt =
        document.getElementById("startObenAktuell");

    const obenNeu =
        document.getElementById("startObenNeu");

    const untenAlt =
        document.getElementById("startUntenAktuell");

    const untenNeu =
        document.getElementById("startUntenNeu");

    const neuerObenIndex =
        (startBildIndex + 2) % startBilder.length;

    const neuerUntenIndex =
        (startBildIndex + 3) % startBilder.length;

    obenNeu.style.backgroundImage =
        `url("${startBilder[neuerObenIndex]}")`;

    untenNeu.style.backgroundImage =
        `url("${startBilder[neuerUntenIndex]}")`;

    obenNeu.className =
        "startBild naechstesRechts";

    untenNeu.className =
        "startBild naechstesLinks";

    void obenNeu.offsetWidth;

    obenAlt.className =
        "startBild rausLinks";

    untenAlt.className =
        "startBild rausRechts";

    obenNeu.className =
        "startBild aktuell";

    untenNeu.className =
        "startBild aktuell";

    setTimeout(function() {

        obenAlt.style.backgroundImage =
            obenNeu.style.backgroundImage;

        untenAlt.style.backgroundImage =
            untenNeu.style.backgroundImage;

        obenAlt.className =
            "startBild aktuell";

        untenAlt.className =
            "startBild aktuell";

        obenNeu.className =
            "startBild naechstesRechts";

        untenNeu.className =
            "startBild naechstesLinks";

        startBildIndex =
            (startBildIndex + 2) %
            startBilder.length;

    }, 1450);
}


async function ladeNeuesteNews() {

    const titelElement =
        document.getElementById("startNews");

    const datumElement =
        document.getElementById("startNewsDatum");

    const bildElement =
        document.getElementById("startNewsBild");

    try {

        const antwort =
            await fetch(
                "latest-news.json?ts=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!antwort.ok) {
            throw new Error(
                "latest-news.json konnte nicht geladen werden."
            );
        }

        const daten =
            await antwort.json();

        if (
            daten.status !== "ok" ||
            !daten.title
        ) {
            throw new Error(
                "Keine aktuelle Meldung vorhanden."
            );
        }

        titelElement.textContent =
            daten.title;

        if (daten.publishedDate) {

            const datum =
                new Date(
                    daten.publishedDate
                );

            datumElement.textContent =
                "Veröffentlicht am " +
                datum.toLocaleDateString(
                    "de-DE",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

        } else {

            datumElement.textContent = "";

        }

        if (daten.image) {

            bildElement.src =
                daten.image;

            bildElement.alt =
                daten.title;

            bildElement.style.display =
                "block";

        } else {

            bildElement.style.display =
                "none";

        }

    } catch (fehler) {

        titelElement.textContent =
            "Zurzeit keine aktuelle Meldung verfügbar.";

        datumElement.textContent = "";

        bildElement.style.display =
            "none";

        console.error(
            "News konnten nicht geladen werden:",
            fehler
        );
    }
}

function starteStartseite() {

    aktualisiereStartZeit();
    ladeNeuesteNews();

    if (!startBildTimer) {

        startBildTimer =
            setInterval(
                wechsleStartBilder,
                20000
            );
    }
}

setInterval(
    aktualisiereStartZeit,
    1000
);

setInterval(
    ladeNeuesteNews,
    60 * 60 * 1000
);


/* ================================
   NAVIGATION ZURÜCKSETZEN
   ================================ */

function navigationZuruecksetzen() {

    document
        .querySelectorAll(".navButton")
        .forEach(
            function(button) {

                button
                    .classList
                    .remove("aktiv");

            }
        );

}


/* ================================
   NAVIGATION AKTIVIEREN
   ================================ */

function aktiviereNavigation(id) {

    navigationZuruecksetzen();

    document
        .getElementById(id)
        .classList
        .add("aktiv");

}


/* ================================
   WEBSEITE ANZEIGEN
   ================================ */

function zeigeIframe(url) {


    document
        .getElementById("startSeite")
        .style.display =
        "none";

    document
        .getElementById("mehrSeite")
        .style.display =
        "none";

    document
        .getElementById("kartenSeite")
        .style.display =
        "none";

    document
        .getElementById("dorfladenSeite")
        .style.display =
        "none";


    const iframe =
        document
        .getElementById("anzeige");


    iframe.style.display =
        "block";


    iframe.src =
        url;

}


/* ================================
   START
   ================================ */

function zeigeStart() {

    document
        .getElementById("anzeige")
        .style.display =
        "none";

    document
        .getElementById("mehrSeite")
        .style.display =
        "none";

    document
        .getElementById("kartenSeite")
        .style.display =
        "none";

    document
        .getElementById("dorfladenSeite")
        .style.display =
        "none";

    document
        .getElementById("startSeite")
        .style.display =
        "block";

    aktiviereNavigation(
        "nav-start"
    );

    starteStartseite();

}


/* ================================
   NEWS
   ================================ */

function zeigeNews() {

    zeigeIframe(
        urls.news
    );

    aktiviereNavigation(
        "nav-news"
    );

}


/* ================================
   TERMINE
   ================================ */

function zeigeTermine() {

    zeigeIframe(
        urls.termine
    );

    aktiviereNavigation(
        "nav-termine"
    );

}


/* ================================
   MEHR
   ================================ */

function zeigeMehr() {


    document
        .getElementById("anzeige")
        .style.display =
        "none";

    document.getElementById("kartenSeite").style.display = "none";


    document
        .getElementById("mehrSeite")
        .style.display =
        "block";


    aktiviereNavigation(
        "nav-mehr"
    );

}




/* ================================
   VEREINE
   ================================ */

function zeigeDorfladen() {

    document
        .getElementById("anzeige")
        .style.display = "none";

    document
        .getElementById("mehrSeite")
        .style.display = "none";

    document
        .getElementById("kartenSeite")
        .style.display = "none";

    document
        .getElementById("dorfladenSeite")
        .style.display = "block";

    zeigeDorfladenMenue();

    aktiviereNavigation(
        "nav-mehr"
    );

}



function zeigeDorfladenMenue() {

    document
        .getElementById("dorfladenMenue")
        .style.display = "block";

    document
        .getElementById("dorfladenInhalt")
        .style.display = "none";

    document
        .getElementById("dorfladenIframe")
        .src = "about:blank";
}



function zeigeDorfladenInhalt(bereich) {

    const menue =
        document.getElementById("dorfladenMenue");

    const inhalt =
        document.getElementById("dorfladenInhalt");

    const text =
        document.getElementById("dorfladenText");

    const iframe =
        document.getElementById("dorfladenIframe");

    menue.style.display = "none";
    inhalt.style.display = "block";

    text.style.display = "block";
    iframe.style.display = "none";
    iframe.src = "about:blank";

    if (bereich === "sortiment") {

        text.innerHTML = `
            <h2>Sortiment</h2>

            <img
                src="images/dorfladen_front.png"
                alt="Dorfladen Hagen mit Warenauslage"
                style="width:100%; border-radius:16px; margin:8px 0 20px 0;"
            >

            <p>
                Im Dorfladen gibt es ein vielseitiges Sortiment für den täglichen Bedarf.
                Dazu gehören unter anderem regionale Produkte, Bio-Produkte sowie Blumen
                und weitere saisonale Artikel.
            </p>

            <img
                src="images/dorfladen_sortiment.png"
                alt="Produkte im Dorfladen"
                style="width:100%; border-radius:16px; margin:14px 0 20px 0;"
            >
        `;

        return;
    }

    if (bereich === "steckbrief") {

        text.innerHTML = `
            <h2>Unser Dorfladen Hagen</h2>

            <img
                src="images/dorfladen_aussen.png"
                alt="Dorfladen Hagen"
                style="width:100%; border-radius:16px; margin:8px 0 20px 0;"
            >

            <p>
                Der Dorfladen wurde im Herbst 2019 gegründet,
                nachdem das letzte Lebensmittelgeschäft im Ort
                geschlossen hatte.
            </p>

            <p>
                Rund 250 Gesellschafterinnen und Gesellschafter
                tragen den Dorfladen mit.
            </p>

            <h3>Eine gute Nahversorgung</h3>

            <p>
                Ziel ist eine gute und bezahlbare Versorgung im Ort.
                Zum Sortiment gehören zunehmend regionale Produkte,
                zum Beispiel Kartoffeln, Eier, Käse, Wurstwaren
                und Fisch aus der näheren Umgebung.
            </p>

            <h3>Sozialer Dorfmittelpunkt</h3>

            <p>
                Der Dorfladen soll nicht nur Einkaufsort,
                sondern auch Treffpunkt für die Dorfgemeinschaft sein.
                Freundlichkeit, Hilfsbereitschaft und Service
                stehen dabei im Mittelpunkt.
            </p>
        `;

        return;
    }

    if (bereich === "geschenkkoerbe") {

        text.innerHTML = `
            <h2>Geschenkkörbe / Weihnachtspakete</h2>

            <img

let dorfkarte = null;
const markerFarben = {lightgreen:'#86c779',yellow:'#f2c94c',blue:'#2f80ed',mediumred:'#d9534f',lightyellow:'#f6e58d',lightblue:'#74b9ff',darkgreen:'#277a45',darkred:'#9b2c2c',white:'#f5f5f5',mediumgreen:'#4fa66b',olive:'#808000',green:'#27ae60',darkorange:'#d96b00',darkgrey:'#555555',red:'#d63031',orange:'#f39c12',purple:'#8e44ad'};
function zeigeKarte(){
 document.getElementById('anzeige').style.display='none';
 document.getElementById('mehrSeite').style.display='none';
 document.getElementById('kartenSeite').style.display='block';
 aktiviereNavigation('nav-mehr');
 if(!dorfkarte){
  dorfkarte=L.map('dorfkarte').setView([51.249995635027,7.974298623832],13);
  L.maplibreGL({style:'https://tiles.openfreemap.org/styles/liberty'}).addTo(dorfkarte);
  kartenPunkte.forEach(function(p){
   const farbe=markerFarben[p.color]||'#43996f';
   const icon=L.divIcon({className:'',html:'<div class="kartenMarker" style="background:'+farbe+'"></div>',iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
   L.marker([p.lat,p.lon],{icon:icon}).addTo(dorfkarte).bindPopup('<strong>'+escapeHtml(p.title)+'</strong>'+(p.subtitle?'<br>'+escapeHtml(p.subtitle):''));
  });
 }
 setTimeout(function(){dorfkarte.invalidateSize();},100);
}
function escapeHtml(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}

/* ================================
   AUTOMATISCHE RÜCKKEHR
   NACH 5 MINUTEN
   ================================ */

let rueckkehrTimer;


function timerNeuStarten() {


    clearTimeout(
        rueckkehrTimer
    );


    rueckkehrTimer =
        setTimeout(

            function() {

                zeigeStart();

            },

            5 * 60 * 1000

        );

}


document.addEventListener(
    "click",
    timerNeuStarten
);


document.addEventListener(
    "touchstart",
    timerNeuStarten
);


zeigeStart();

timerNeuStarten();

</script>
