<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<title>Wildes Hagen</title>


<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

<style>

/* ================================
   GRUNDEINSTELLUNGEN
   ================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #ffffff;
}


/* ================================
   GESAMTE APP
   ================================ */

#app {
    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
}


/* ================================
   INHALTSBEREICH
   ================================ */

#content {
    flex: 1;

    position: relative;

    overflow: hidden;

    background: white;
}


/* ================================
   APPACK / WEBSEITEN
   ================================ */

#anzeige {
    width: 100%;
    height: 100%;

    border: none;

    display: block;

    background: white;
}


/* ================================
   MEHR-SEITE
   ================================ */

#mehrSeite {

    display: none;

    width: 100%;
    height: 100%;

    overflow-y: auto;

    padding:
        40px
        30px
        60px
        30px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #edf7f2 100%
        );
}


.mehrTitel {

    margin:
        0
        0
        35px
        0;

    text-align: center;

    color: #489a70;

    font-size: 38px;
}


/* ================================
   MEHR BUTTONS
   ================================ */

.mehrGrid {

    max-width: 950px;

    margin: auto;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 25px;
}


.mehrButton {

    min-height: 170px;

    border: none;

    border-radius: 22px;

    background: white;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,0.12);

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 13px;

    font-size: 54px;

    font-weight: bold;

    color: #333333;
}


.mehrButton:active {

    transform:
        scale(0.97);

}


.mehrIcon {

    font-size: 52px;

}


.mehrHinweis {

    font-size: 14px;

    font-weight: normal;

    color: #888888;

}


/* ================================
   UNTERE NAVIGATION
   ================================ */

#navigationBereich {

    background: white;

    padding:
        8px
        15px
        max(
            8px,
            env(safe-area-inset-bottom)
        );

    box-shadow:
        0 -3px 15px
        rgba(0,0,0,0.12);

    z-index: 100;
}


#navigation {

    max-width: 800px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    border:
        2px solid
        #eeeeee;

    border-radius: 35px;

    padding: 5px;

    background: white;
}


.navButton {

    min-height: 75px;

    border: none;

    border-radius: 28px;

    background: transparent;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    gap: 3px;

    color: #222222;

    font-size: 15px;
}


.navIcon {
    width: 30px;
    height: 30px;
    line-height: 30px;
}

.navIcon svg {
    width: 30px;
    height: 30px;
    display: block;
    fill: currentColor;
}


.navButton.aktiv {

    color: #43996f;

    background: #edf7f2;

    font-weight: bold;

}


.navButton:active {

    transform:
        scale(0.95);

}


/* ================================
   HANDY / KLEINERE DISPLAYS
   ================================ */

@media (max-width:600px) {

    .mehrSeite {
        padding:
            25px
            15px
            40px
            15px;
    }

    .mehrTitel {
        font-size: 30px;
        margin-bottom: 22px;
    }

    .mehrGrid {
        gap: 14px;
    }

    .mehrButton {

        min-height: 130px;

        font-size: 34px;

        padding: 10px;
    }

    .mehrIcon {
        font-size: 39px;
    }

    .mehrHinweis {
        font-size: 12px;
    }

    .navButton {

        min-height: 63px;

        font-size: 12px;
    }

    .navIcon,
    .navIcon svg {
        width: 26px;
        height: 26px;
    }

}


/* DORFKARTE */
#kartenSeite{display:none;width:100%;height:100%;position:relative;background:white;}
#dorfkarte{width:100%;height:100%;}
.kartenMarker{width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.leaflet-popup-content{font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:1.35;}
.leaflet-popup-content strong{font-size:19px;}


/* ================================
   EIGENE STARTSEITE v0.9.2
   ================================ */

#startSeite {
    display: none;
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #1f3e31;
}

.startBildEbene {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
}

.startBildHaelfte {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
}

.startBildHaelfte.oben { top: 0; }
.startBildHaelfte.unten { bottom: 0; }

.startBild {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: transform 1.35s ease-in-out, opacity 1.35s ease-in-out;
    will-change: transform, opacity;
}

.startBild.aktuell { transform: translateX(0); opacity: 1; }
.startBild.naechstesRechts { transform: translateX(100%); opacity: 1; }
.startBild.naechstesLinks { transform: translateX(-100%); opacity: 1; }

.startBild.rausLinks { transform: translateX(-100%); opacity: .95; }
.startBild.rausRechts { transform: translateX(100%); opacity: .95; }

.startAbdunklung {
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.22) 0%,
            rgba(0,0,0,.10) 36%,
            rgba(0,0,0,.18) 100%
        );
}

.startVordergrund {
    position: absolute;
    inset: 0;
    z-index: 3;
    padding: 70px 90px 260px 90px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    pointer-events: none;
}

.startHeadline {
    width: min(94%, 1850px);
    margin: 0 auto;
    background: rgba(255,255,255,.94);
    border-radius: 32px;
    padding: 18px 26px;
    box-shadow: 0 8px 28px rgba(0,0,0,.20);
}

.startHeadline img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
}

.startInfoBereich {
    margin-top: 70px;
    width: min(78%, 1500px);
    display: grid;
    gap: 34px;
}

.startKarte {
    background: rgba(255,255,255,.91);
    border-radius: 30px;
    box-shadow: 0 7px 24px rgba(0,0,0,.18);
    padding: 34px 42px;
    color: #173a2a;
    backdrop-filter: blur(4px);
}

.startDatum {
    font-size: 24px;
    font-weight: 700;
}

.startUhrzeit {
    font-size: 100px;
    line-height: 1.05;
    font-weight: 800;
    margin-top: 10px;
}

.startInfoTitel {
    font-size: 17px;
    font-weight: 800;
    color: #3f7f5b;
    margin-bottom: 12px;
}

.startInfoWert {
    font-size: 46px;
    font-weight: 700;
}

.startInfoHinweis {
    font-size: 28px;
    margin-top: 3px;
    color: #555;
}

.startQr {
    position: absolute;
    z-index: 4;
    right: 58px;
    bottom: 112px;
    width: min(31vw, 520px);
    background: rgba(255,255,255,.95);
    border-radius: 28px;
    padding: 18px;
    box-sizing: border-box;
    box-shadow: 0 8px 26px rgba(0,0,0,.22);
    text-align: center;
}

.startQrTitel {
    font-size: 30px;
    line-height: 1.25;
    font-weight: 800;
    color: #256744;
    margin: 2px 0 7px 0;
}

.startQr img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
}

@media (max-width: 900px) {
    .startVordergrund {
        padding: 10px 10px 95px 10px;
    }

    .startHeadline {
        width: 98%;
        padding: 5px 8px;
        border-radius: 12px;
    }

    .startInfoBereich {
        width: 67%;
        margin-top: 9px;
        gap: 7px;
    }

    .startKarte {
        padding: 9px 11px;
        border-radius: 12px;
    }

    .startDatum { font-size: 17px; }
    .startUhrzeit { font-size: 31px; }
    .startInfoTitel { font-size: 14px; }
    .startInfoWert { font-size: 17px; }
    .startInfoHinweis { font-size: 13px; }

    .startQr {
        right: 10px;
        bottom: 95px;
        width: 30vw;
        min-width: 185px;
        padding: 7px;
        border-radius: 12px;
    }

    .startQrTitel {
        font-size: 13px;
    }
}

</style>
</head>


<body>

<div id="app">

<main id="content">

    <div id="startSeite">

<!-- DORFLADEN -->

</div>

<script>


/* ================================
   ADRESSEN
   ================================ */

const urls = {


start:
    "about:blank",


    news:
    "https://shorturl.appack.de/sundern_Application_1765195867222",


    termine:
    "https://shorturl.appack.de/sundern_Application_1663675240711?calendarIds=",
vereine:
    "https://appack.de/rest-api/drender/6374f7dce4b08baba4be8855",


    chronik:
    "https://freiheit-hagen.de/unsere-doerfer/dorfchronik/",


    stammtische:
    "https://cdn.appack.de/sundern/html/Stammtischhistorie.html"
};



/* ================================
   STARTSEITE v0.9.2
   ================================ */

const startBilder = [
    "images/start_1.png",
    "images/start_3.png",
    "images/start_2.png",
    "images/start_4.png"
];

let startBildIndex = 0;
let startBildTimer = null;

function aktualisiereStartZeit() {

    const jetzt = new Date();

    document
        .getElementById("startDatum")
        .textContent =
        jetzt.toLocaleDateString(
            "de-DE",
            {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );

    document
        .getElementById("startUhrzeit")
        .textContent =
        jetzt.toLocaleTimeString(
            "de-DE",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ) + " Uhr";
}

function wechsleStartBilder() {

    const obenAlt =
        document.getElementById("startObenAktuell");

    const obenNeu =
        document.getElementById("startObenNeu");

    const untenAlt =
        document.getElementById("startUntenAktuell");

    const untenNeu =
        document.getElementById("startUntenNeu");

    const neuerObenIndex =
        (startBildIndex + 2) % startBilder.length;

    const neuerUntenIndex =
        (startBildIndex + 3) % startBilder.length;

    obenNeu.style.backgroundImage =
        `url("${startBilder[neuerObenIndex]}")`;

    untenNeu.style.backgroundImage =
        `url("${startBilder[neuerUntenIndex]}")`;

    obenNeu.className =
        "startBild naechstesRechts";

    untenNeu.className =
        "startBild naechstesLinks";

    void obenNeu.offsetWidth;

    obenAlt.className =
        "startBild rausLinks";

    untenAlt.className =
        "startBild rausRechts";

    obenNeu.className =
        "startBild aktuell";

    untenNeu.className =
        "startBild aktuell";

    setTimeout(function() {

        obenAlt.style.backgroundImage =
            obenNeu.style.backgroundImage;

        untenAlt.style.backgroundImage =
            untenNeu.style.backgroundImage;

        obenAlt.className =
            "startBild aktuell";

        untenAlt.className =
            "startBild aktuell";

        obenNeu.className =
            "startBild naechstesRechts";

        untenNeu.className =
            "startBild naechstesLinks";

        startBildIndex =
            (startBildIndex + 2) %
            startBilder.length;

    }, 1450);
}


async function ladeNeuesteNews() {

    const titelElement =
        document.getElementById("startNews");

    const datumElement =
        document.getElementById("startNewsDatum");

    const bildElement =
        document.getElementById("startNewsBild");

    try {

        const antwort =
            await fetch(
                "latest-news.json?ts=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!antwort.ok) {
            throw new Error(
                "latest-news.json konnte nicht geladen werden."
            );
        }

        const daten =
            await antwort.json();

        if (
            daten.status !== "ok" ||
            !daten.title
        ) {
            throw new Error(
                "Keine aktuelle Meldung vorhanden."
            );
        }

        titelElement.textContent =
            daten.title;

        if (daten.publishedDate) {

            const datum =
                new Date(
                    daten.publishedDate
                );

            datumElement.textContent =
                "Veröffentlicht am " +
                datum.toLocaleDateString(
                    "de-DE",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

        } else {

            datumElement.textContent = "";

        }

        if (daten.image) {

            bildElement.src =
                daten.image;

            bildElement.alt =
                daten.title;

            bildElement.style.display =
                "block";

        } else {

            bildElement.style.display =
                "none";

        }

    } catch (fehler) {

        titelElement.textContent =
            "Zurzeit keine aktuelle Meldung verfügbar.";

        datumElement.textContent = "";

        bildElement.style.display =
            "none";

        console.error(
            "News konnten nicht geladen werden:",
            fehler
        );
    }
}

function starteStartseite() {

    aktualisiereStartZeit();
    ladeNeuesteNews();

    if (!startBildTimer) {

        startBildTimer =

/* ================================

   ================================ */

function navigationZuruecksetzen() {

    document
        .querySelectorAll(".navButton")
        .forEach(
            function(button) {

                button
                    .classList
                    .remove("aktiv");

            }
        );

}


/* ================================
   NAVIGATION AKTIVIEREN
   ================================ */

function aktiviereNavigation(id) {

    navigationZuruecksetzen();

    document
        .getElementById(id)
        .classList
        .add("aktiv");

}

   const farbe=markerFarben[p.color]||'#43996f';
   const icon=L.divIcon({className:'',html:'<div class="kartenMarker" style="background:'+farbe+'"></div>',iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
   L.marker([p.lat,p.lon],{icon:icon}).addTo(dorfkarte).bindPopup('<strong>'+escapeHtml(p.title)+'</strong>'+(p.subtitle?'<br>'+escapeHtml(p.subtitle):''));
  });
 }
 setTimeout(function(){dorfkarte.invalidateSize();},100);
}
function escapeHtml(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}

/* ================================
   AUTOMATISCHE RÜCKKEHR
   NACH 5 MINUTEN
   ================================ */

let rueckkehrTimer;


function timerNeuStarten() {


    clearTimeout(
        rueckkehrTimer
    );


    rueckkehrTimer =
        setTimeout(

            function() {

                zeigeStart();

            },

            5 * 60 * 1000

        );

}


document.addEventListener(
    "click",
    timerNeuStarten
);


document.addEventListener(
    "touchstart",
    timerNeuStarten
);


zeigeStart();

timerNeuStarten();

</script>
